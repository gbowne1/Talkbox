name: TalkBox CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, mongodb
          coverage: none

      - name: Validate composer.json
        run: composer validate --strict

      - name: Generate composer.lock if missing
        run: |
          if [ ! -f composer.lock ]; then
            echo "composer.lock missing — generating it now..."
            composer update --no-interaction --prefer-dist

            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add composer.lock
            git commit -m "Add composer.lock (auto-generated by CI)" || echo "No changes to commit"
            git push
          else
            echo "composer.lock already exists — skipping generation."
          fi

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP files
        run: |
          find . -type f -name "*.php" -print0 | xargs -0 -n1 php -l
