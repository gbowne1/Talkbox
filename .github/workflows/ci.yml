name: TalkBox CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ALLOW_EMPTY_PASSWORD: yes
          MYSQL_DATABASE: talkbox
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=3
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql
          coverage: none

      - name: Validate Database Schema
        run: |
          # The CI starts a MySQL service automatically if you have it in your 'services' block
          mysql -h 127.0.0.1 -u root -e "CREATE DATABASE IF NOT EXISTS talkbox;"
          mysql -h 127.0.0.1 -u root talkbox < database/migrations/001_create_users.sql
          mysql -h 127.0.0.1 -u root talkbox < database/migrations/002_create_message.sql
          mysql -h 127.0.0.1 -u root talkbox < database/migrations/003_create_usrooms.sql
          mysql -h 127.0.0.1 -u root talkbox < database/seeds/demo_data.sql

      - name: PHPStan Static Analysis
        run: |
          composer require --dev phpstan/phpstan
          # Analyze everything in src and bin
          vendor/bin/phpstan analyse src bin --level 5

      - name: Validate composer.json
        run: composer validate --strict

      - name: Generate composer.lock if missing
        run: |
          if [ ! -f composer.lock ]; then
            echo "composer.lock missing — generating it now..."
            composer update --no-interaction --prefer-dist

            git config user.name "github-actions"
            git config user.email "actions@github.com"
            git add composer.lock
            git commit -m "Add composer.lock (auto-generated by CI)" || echo "No changes to commit"
            git push
          else
            echo "composer.lock already exists — skipping generation."
          fi

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Lint PHP files
        run: |
          find . -type f -name "*.php" -print0 | xargs -0 -n1 php -l
